        *{ font-family:"Geist", -apple-system, BlinkMacSystemFont, sans-serif; box-sizing:border-box; }

        .mono{ font-family:"Geist Mono", monospace; }
        .header-icon{

        }
        .stat-card{
          background: var(--surface);
          border:1px solid var(--border);
          border-radius:20px;
          padding:18px 16px;
          position:relative;
          overflow:hidden;
        }

          background: var(--surface);
          border:1px solid var(--border);
          border-radius:22px;
          padding:16px;
          display:flex;
          gap:14px;
          align-items:flex-start;
          transition: transform .15s;
        }
        .sub-card:active{ transform:scale(0.99); }
        .emoji-box{

          font-size:24px;
        }
        .count-circle{

        }
        .overlay{
          position:fixed; inset:0;

          backdrop-filter: blur(8px);
          z-index:40;

        .overlay.open{ opacity:1; pointer-events:auto; }

          overflow-y:auto;
          padding: 20px 20px calc(24px + env(safe-area-inset-bottom));

        }
        .sheet.open{ transform: translateY(0); }
        .sheet::-webkit-scrollbar{ display:none; }
        .date-container-fixed{
          display:flex;
          flex-direction:column;
          gap:12px;
          padding:16px;
          border-radius:16px;
          background: rgba(255,255,255,0.04);
          border:1px solid rgba(255,255,255,0.12);
          overflow:visible;
          min-height:auto;
        }
        [data-theme='light'] .date-container-fixed{

          border-color: rgba(0,0,0,0.08);
        }
        .date-display-fixed{
          height:52px;
          width:100%;
          display:flex;
          align-items:center;
          justify-content:center;
          background: rgba(255,255,255,0.08);
          border:1px solid rgba(255,255,255,0.12);
          border-radius:12px;
          font-size:15px;
          color: white;
          cursor:pointer;
          user-select:none;
          letter-spacing:0.2px;
          transition: background .15s, border-color .15s;
          text-align:center;
          line-height:1;
          overflow:visible;
          white-space:nowrap;
        }
        [data-theme='light'] .date-display-fixed{
          background: rgba(0,0,0,0.04);
          border-color: rgba(0,0,0,0.08);
          color: #111;
        }
        .date-display-fixed:active{ background: rgba(255,255,255,0.12); }
        .date-hint{
          margin-top:8px;
          font-size:12px;
          color: var(--text-muted);
          line-height:1.4;
        }
        .seg{
          display:flex; background: var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:4px; gap:4px;
        }
        .seg button{
          flex:1; height:38px; border-radius:10px; font-size:14px; font-weight:500; border:0; background:transparent; color:var(--text-muted); cursor:pointer; transition:.15s;
        }
        .seg button.active{ background:var(--surface); color:var(--text); border:1px solid var(--border); box-shadow:0 1px 2px rgba(0,0,0,.1); }
        .day-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap:6px; }
        .day-btn{ height:36px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); font-size:13px; cursor:pointer; }
        .day-btn.active{ background:var(--text); color:var(--bg); border-color:var(--text); }
        .chip{ height:36px; min-width:36px; padding:0 6px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); display:flex;align-items:center;justify-content:center; cursor:pointer; font-size:18px; }
        .chip.active{ border-color: var(--text); background: var(--surface); }
        .field{ display:flex; flex-direction:column; gap:8px; }
        .field label{ font-size:13px; color:var(--text-muted); font-weight:500; }
        .input{
          height:44px; border-radius:12px; border:1px solid var(--border); background: var(--surface-2);
          padding:0 14px; color:var(--text); font-size:15px; outline:none; width:100%;
        }
        .input:focus{ border-color: var(--text); }
        textarea.input{ height:auto; min-height:72px; padding:12px 14px; resize:none; }
