        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap');
        :root{
          --bg:#000000;
          --surface:#0a0a0b;
          --card:#151518;
          --card2:#1c1c20;
          --border:#222227;
          --border2:#2a2a30;
          --text:#f5f5f2;
          --muted:#8b8b93;
          --muted2:#5a5a64;
          --green:#b8ff7a;
          --red:#ff6b6b;
          --yellow:#ffd86b;
        }
        *{box-sizing:border-box}
        html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
        html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Geist",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased; touch-action: manipulation;}
        button{font-family:inherit}
        /* iOS auto-zoom prevention - min 16px */
        input, textarea, select,
        input[type="text"], input[type="number"], input[type="date"]{
          font-size:16px !important;
          -webkit-text-size-adjust:100%;
          touch-action: manipulation;
          -webkit-tap-highlight-color: transparent;
          pointer-events:auto;
        }
        /* keep emoji icon input >=16px but visually larger */
        .icon-input{ font-size:22px !important; }
        .app-shell{min-height:100vh;background:var(--bg);padding-top:var(--safe-area-inset-top);display:flex;flex-direction:column}
        .header{
          position:sticky;top:var(--safe-area-inset-top);z-index:20;
          background:rgba(0,0,0,.82);backdrop-filter:blur(20px);
          border-bottom:1px solid var(--border);
          padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
        }
        .brand{display:flex;align-items:center;gap:10px}
        .logo{width:32px;height:32px;background:#fff;color:#000;border-radius:9px;display:grid;place-items:center;font-size:18px;font-weight:700}
        .title{font-size:15px;font-weight:600;letter-spacing:-0.02em}
        .pill{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:#1e1e22;border:1px solid var(--border2);color:var(--muted);padding:3px 8px;border-radius:99px;margin-left:8px}
        .btn-primary{background:#fff;color:#000;border:0;border-radius:99px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;pointer-events:auto}
        .btn-primary:active{transform:scale(.97)}
        .wrap{max-width:720px;width:100%;margin:0 auto;padding:18px 14px 120px;flex:1}
        .stats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
        .stats::-webkit-scrollbar{display:none}
        .stat{flex:1 0 0;min-width:142px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 13px}
        .stat-label{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-bottom:6px}
        .stat-val{font-size:18px;font-weight:600;letter-spacing:-0.03em;display:flex;align-items:baseline;gap:2px}
        .stat-val small{font-size:11px;font-weight:400;color:var(--muted)}
        .stat-sub{font-size:11px;color:var(--muted2);margin-top:3px}
        .list{margin-top:18px;display:flex;flex-direction:column;gap:8px}
        .card{
          background:var(--card);border:1px solid var(--border);border-radius:16px;
          padding:12px 12px 12px 12px;display:flex;align-items:center;gap:12px;
          transition:border-color .15s,transform .15s;cursor:default;
        }
        .card:hover{border-color:var(--border2)}
        .icon-box{width:48px;height:48px;flex:0 0 48px;background:var(--card2);border:1px solid var(--border);border-radius:13px;display:grid;place-items:center;font-size:22px}
        .mid{flex:1;min-width:0}
        .name-row{display:flex;align-items:center;gap:6px}
        .name{font-size:14px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .trial-badge{font-size:9px;font-weight:700;letter-spacing:.05em;background:var(--yellow);color:#000;padding:2px 5px;border-radius:5px}
        .price-row{display:flex;align-items:center;gap:6px;margin-top:2px}
        .price{font-size:13px;color:var(--muted);font-family:"Geist Mono",monospace}
        .cycle{font-size:10px;background:#222227;border:1px solid var(--border);color:var(--muted);padding:2px 6px;border-radius:99px}
        .cat{font-size:10px;color:var(--muted2)}
        .right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:0 0 auto}
        .countdown{font-size:11px;font-weight:600;padding:4px 8px;border-radius:99px;border:1px solid var(--border);background:#101012}
        .countdown.urgent{background:var(--yellow);color:#000;border-color:var(--yellow)}
        .countdown.over{background:var(--red);color:#fff;border-color:var(--red)}
        .actions{display:flex;gap:4px}
        .icon-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--muted);display:grid;place-items:center;cursor:pointer;font-size:12px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;pointer-events:auto}
        .icon-btn:hover{color:var(--text);border-color:var(--border2)}
        .empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:16px;margin-top:10px}
        .footer{border-top:1px solid var(--border);padding:14px;text-align:center;font-size:11px;color:var(--muted2);font-family:"Geist Mono",monospace;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
        /* bottom sheet */
        .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0;pointer-events:auto}
        .sheet{width:100%;max-width:560px;background:#111113;border-top:1px solid var(--border2);border-left:1px solid var(--border2);border-right:1px solid var(--border2);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.16,1,.3,1);pointer-events:auto;position:relative;z-index:2}
        @keyframes up{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
        .sheet-head{position:sticky;top:0;background:#111113;padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;z-index:2}
        .sheet-title{font-size:15px;font-weight:600}
        .close-btn{width:28px;height:28px;border-radius:99px;border:1px solid var(--border);background:var(--card2);color:var(--muted);display:grid;place-items:center;cursor:pointer;touch-action:manipulation;pointer-events:auto}
        .sheet-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
        .field{display:flex;flex-direction:column;gap:6px}
        .label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
        .input, .select, .textarea{
          width:100%;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px 12px;font-size:14px;color:var(--text);outline:none;transition:border-color .15s;
          touch-action: manipulation; -webkit-tap-highlight-color: transparent; pointer-events:auto; position:relative; z-index:1;
        }
        .input:focus,.select:focus,.textarea:focus{border-color:var(--border2);background:var(--card2)}
        .textarea{resize:none;height:68px}
        .row{display:flex;gap:8px}
        .icon-input{width:56px;flex:0 0 56px;height:52px;text-align:center;font-size:22px}
        .chips{flex:1;display:flex;gap:6px;overflow-x:auto;align-items:center;scrollbar-width:none;padding:2px 0}
        .chips::-webkit-scrollbar{display:none}
        .chip{width:36px;height:36px;flex:0 0 36px;border-radius:10px;border:1px solid var(--border);background:var(--card2);display:grid;place-items:center;font-size:16px;cursor:pointer;touch-action:manipulation;pointer-events:auto}
        .chip.active{border-color:#fff;background:#fff;color:#000}
        .price-group{display:flex;gap:0;align-items:stretch}
        .hk-badge{flex:0 0 56px;background:var(--card2);border:1px solid var(--border);border-right:0;border-radius:11px 0 0 11px;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);font-family:"Geist Mono",monospace}
        .price-input{border-radius:0 11px 11px 0 !important}
        .segment{display:flex;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:3px;gap:3px;pointer-events:auto}
        .seg-btn{flex:1;padding:9px 8px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;touch-action:manipulation;pointer-events:auto}
        .seg-btn.active{background:#fff;color:#000}
        .check-row{display:flex;align-items:center;gap:8px;padding:8px 2px}
        .check-row input{width:16px;height:16px;accent-color:#fff}
        .actions-row{display:flex;gap:8px;margin-top:6px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
        .btn-ghost{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;touch-action:manipulation;pointer-events:auto}
        .btn-save{flex:1.2;background:#fff;color:#000;border:0;border-radius:12px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;touch-action:manipulation;pointer-events:auto}
        .date-input{height:52px !important}
        .del-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:grid;place-items:center;padding:18px;pointer-events:auto}
        .del-box{width:100%;max-width:340px;background:#18181b;border:1px solid var(--border2);border-radius:16px;padding:18px;pointer-events:auto}
        .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#000;padding:8px 14px;border-radius:99px;font-size:12px;font-weight:600;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.4)}
        /* NEW: monthly billing fix */
        .billing-wrap{display:flex;align-items:stretch;gap:0;background:var(--card);border:1px solid var(--border);border-radius:11px;overflow:hidden;pointer-events:auto;position:relative;z-index:5;touch-action:manipulation}
        .billing-wrap:focus-within{border-color:var(--border2);background:var(--card2)}
        .billing-input{border:0 !important;background:transparent !important;text-align:center;font-size:16px !important;height:52px !important;min-width:0;flex:1;touch-action:manipulation;user-select:text;-webkit-user-select:text;pointer-events:auto;z-index:6}
        .step-btn{flex:0 0 52px;width:52px;background:var(--card2);border:0;border-right:1px solid var(--border);border-left:1px solid var(--border);color:var(--text);font-size:18px;font-weight:600;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;pointer-events:auto;-webkit-tap-highlight-color:transparent;user-select:none}
        .step-btn:first-child{border-left:0}
        .step-btn:last-child{border-right:0;border-left:1px solid var(--border)}
        .step-btn:active{background:#222227}
        .day-suffix{flex:0 0 36px;display:grid;place-items:center;font-size:13px;color:var(--muted);font-weight:600;border-left:1px solid var(--border);background:var(--card2)}
        .yearly-btn{width:100%;height:52px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;touch-action:manipulation;pointer-events:auto;position:relative;z-index:5;-webkit-tap-highlight-color:transparent;transition:border-color .15s}
        .yearly-btn:active,.yearly-btn:focus{border-color:var(--border2);background:var(--card2);outline:none}
        .yearly-btn-text{font-size:14px;color:var(--text);font-weight:500}
        .yearly-btn-icon{font-size:12px;color:var(--muted)}
        .hidden-date{position:absolute;opacity:0;pointer-events:none;width:0;height:0;left:-9999px;top:-9999px}
        @media(min-width:640px){
          .wrap{padding:22px 20px 80px}
          .header{padding:16px 24px}
          .sheet{border-radius:20px;margin-bottom:24px;max-height:88vh}
