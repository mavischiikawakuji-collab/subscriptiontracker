        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');
        @tailwind base;
        @tailwind components;
        @tailwind utilities;
        :root{
          --bg: #0e0e10;
          --bg-soft:#18181b;
          --surface:#1e1e22;
          --surface-2:#27272a;
          --border: rgba(255,255,255,0.12);
          --border-strong: rgba(255,255,255,0.18);
          --text:#fafafa;
          --text-muted: rgba(255,255,255,0.55);
          --text-faint: rgba(255,255,255,0.35);
          --accent:#a1ff9c;
          --accent-2:#ff8f8f;
          --accent-3:#8fb5ff;
          --pill-bg: rgba(161,255,156,0.12);
          --pill-border: rgba(161,255,156,0.28);
          --safe-area-inset-top: env(safe-area-inset-top);
        }
        [data-theme='light']{
          --bg:#f6f5f2;
          --bg-soft:#ffffff;
          --surface:#ffffff;
          --surface-2:#f0ede9;
          --border: rgba(0,0,0,0.08);
          --border-strong: rgba(0,0,0,0.14);
          --text:#111;
          --text-muted: rgba(0,0,0,0.55);
          --text-faint: rgba(0,0,0,0.35);
          --pill-bg: rgba(0,0,0,0.06);
          --pill-border: rgba(0,0,0,0.1);
        }
        *{ font-family:"Geist", -apple-system, BlinkMacSystemFont, sans-serif; box-sizing:border-box; }
        body{ background:var(--bg); color:var(--text); }
        .mono{ font-family:"Geist Mono", monospace; }
        /* header */
        .header-icon{
          width:36px;height:36px;display:flex;align-items:center;justify-content:center;
          background:var(--surface-2); border:1px solid var(--border); border-radius:10px; font-size:18px;
        }
        /* stats */
        .stat-card{
          background: var(--surface);
          border:1px solid var(--border);
          border-radius:20px;
          padding:18px 16px;
          position:relative;
          overflow:hidden;
        }
        /* list card */
        .sub-card{
          background: var(--surface);
          border:1px solid var(--border);
          border-radius:22px;
          padding:16px;
          display:flex;
          gap:14px;
          align-items:flex-start;
          transition: transform .15s;
        }
        .sub-card:active{ transform:scale(0.99); }
        .emoji-box{
          width:48px;height:48px;min-width:48px;
          background: var(--surface-2);
          border:1px solid var(--border);
          border-radius:14px;
          display:flex;align-items:center;justify-content:center;
          font-size:24px;
        }
        .count-circle{
          width:54px;height:54px;position:relative;display:flex;align-items:center;justify-content:center;
        }
        /* modal bottom sheet */
        .overlay{
          position:fixed; inset:0;
          background: rgba(0,0,0,0.55);
          backdrop-filter: blur(8px);
          z-index:40;
          opacity:0; pointer-events:none; transition:.25s;
        }
        .overlay.open{ opacity:1; pointer-events:auto; }
        .sheet{
          position:fixed; left:0; right:0; bottom:0;
          background: var(--bg-soft);
          border-top:1px solid var(--border-strong);
          border-radius:28px 28px 0 0;
          z-index:50;
          transform: translateY(100%);
          transition: transform .32s cubic-bezier(.32,.72,0,1);
          max-height:90vh;
          overflow-y:auto;
          padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
          overscroll-behavior: contain;
        }
        .sheet.open{ transform: translateY(0); }
        .sheet::-webkit-scrollbar{ display:none; }
        /* FIXED DATE CONTAINER - v7.1 */
        .date-container-fixed{
          display:flex;
          flex-direction:column;
          gap:12px;
          padding:16px;
          border-radius:16px;
          background: rgba(255,255,255,0.04);
          border:1px solid rgba(255,255,255,0.12);
          overflow:visible;
          min-height:auto;
        }
        [data-theme='light'] .date-container-fixed{
          background: rgba(0,0,0,0.03);
          border-color: rgba(0,0,0,0.08);
        }
        .date-display-fixed{
          height:52px;
          width:100%;
          display:flex;
          align-items:center;
          justify-content:center;
          background: rgba(255,255,255,0.08);
          border:1px solid rgba(255,255,255,0.12);
          border-radius:12px;
          font-size:15px;
          color: white;
          cursor:pointer;
          user-select:none;
          letter-spacing:0.2px;
          transition: background .15s, border-color .15s;
          text-align:center;
          line-height:1;
          overflow:visible;
          white-space:nowrap;
        }
        [data-theme='light'] .date-display-fixed{
          background: rgba(0,0,0,0.04);
          border-color: rgba(0,0,0,0.08);
          color: #111;
        }
        .date-display-fixed:active{ background: rgba(255,255,255,0.12); }
        .date-hint{
          margin-top:8px;
          font-size:12px;
          color: var(--text-muted);
          line-height:1.4;
        }
        /* segmented */
        .seg{
          display:flex; background: var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:4px; gap:4px;
        }
        .seg button{
          flex:1; height:38px; border-radius:10px; font-size:14px; font-weight:500; border:0; background:transparent; color:var(--text-muted); cursor:pointer; transition:.15s;
        }
        .seg button.active{ background:var(--surface); color:var(--text); border:1px solid var(--border); box-shadow:0 1px 2px rgba(0,0,0,.1); }
        /* day grid */
        .day-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap:6px; }
        .day-btn{ height:36px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); font-size:13px; cursor:pointer; }
        .day-btn.active{ background:var(--text); color:var(--bg); border-color:var(--text); }
        /* chips */
        .chip{ height:36px; min-width:36px; padding:0 6px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); display:flex;align-items:center;justify-content:center; cursor:pointer; font-size:18px; }
        .chip.active{ border-color: var(--text); background: var(--surface); }
        /* input */
        .field{ display:flex; flex-direction:column; gap:8px; }
        .field label{ font-size:13px; color:var(--text-muted); font-weight:500; }
        .input{
          height:44px; border-radius:12px; border:1px solid var(--border); background: var(--surface-2);
          padding:0 14px; color:var(--text); font-size:15px; outline:none; width:100%;
        }
        .input:focus{ border-color: var(--text); }
        textarea.input{ height:auto; min-height:72px; padding:12px 14px; resize:none; }
